document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2px solid #0a4f70;font-family:'Jersey 10',sans-serif;font-weight:700;font-size:18px;color:#0a4f70;\">2<\u002Fspan>\n            <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:#12283a;margin:14px 0 0;\">An organisation stands behind it<\u002Fh3>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;line-height:1.6;color:#4d6a7d;margin:6px 0 0;\">A therapy service or school reviews the work and puts their name on it, so a parent knows someone competent read it.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;z-index:1;\">\n            <span style=\"display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:#d8ecf7;border:2px solid #0a4f70;font-family:'Jersey 10',sans-serif;font-weight:700;font-size:18px;color:#0a4f70;\">3<\u002Fspan>\n            <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:#12283a;margin:14px 0 0;\">A family builds it — or receives one<\u002Fh3>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;line-height:1.6;color:#4d6a7d;margin:6px 0 0;\">Follow the guide with about thirty dollars of parts, or claim a toy someone has already adapted.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= GUIDES (LIBRARY) ================= -->\n    <sc-if value=\"{{ isGuides }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 20px; 4px;height:44px;border-radius:50%;border:3px solid #4d6a7d;position:relative;display:block;\"><span style=\"position:absolute;bottom:-9px;right:-9px;width:16px;height:3px;background:#4d6a7d;transform:rotate(45deg);border-radius:2px;\"><\u002Fspan><\u002Fspan>\n        <p style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#12283a;margin:18px 0 0;\">No guides published yet.<\u002Fp>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;max-width:32ch;margin:6px 0 0;line-height:1.5;\">Guides show up here once a contributor writes one and an organisation stands behind it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= TOY LIBRARY ================= -->\n    <sc-if value=\"{{ isToyLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 20px;\">Toy Library<\u002Fh1>\n\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:28px;\">\n        <input type=\"search\" disabled=\"\" placeholder=\"Search by toy name…\" style=\"font-family:'Nunito',sans-serif;font-size:13px;padding:10px 14px;border:2px solid #12283a;border-radius:6px;min-width:220px;background:#fff;color:#12283a;\">\n        <span style=\"display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #12283a;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#12283a;color:#fff;\">Any<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #12283a;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#fff;color:#12283a;box-shadow:3px 3px 0 #12283a;\">Good (7–10)<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #12283a;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#fff;color:#12283a;box-shadow:3px 3px 0 #12283a;\">Fair (4–6)<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #12283a;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#fff;color:#12283a;box-shadow:3px 3px 0 #12283a;\">Well-loved (1–3)<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;padding:8px 14px;border:2px solid #12283a;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#fff;color:#12283a;box-shadow:3px 3px 0 #12283a;\">Switch-adapted<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:#4d6a7d;margin-left:6px;\">0 toys<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 20px;border:2px dashed #c6e0ed;border-radius:10px;background:#ffffff;\">\n        <span style=\"width:44px;height:44px;border-radius:50%;border:3px solid #4d6a7d;position:relative;display:block;\"><span style=\"position:absolute;bottom:-9px;right:-9px;width:16px;height:3px;background:#4d6a7d;transform:rotate(45deg);border-radius:2px;\"><\u002Fspan><\u002Fspan>\n        <p style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#12283a;margin:18px 0 0;\">No toys listed yet.<\u002Fp>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;max-width:32ch;margin:6px 0 0;line-height:1.5;\">Adapted toys families and organisations give away will show up here.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= 3D PRINTING ================= -->\n    <sc-if value=\"{{ isPrinting }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n\n      <div style=\"display:grid;grid-template-columns:1.25fr 0.75fr;gap:40px;align-items:center;\">\n        <div>\n          <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 14px;\">3D Printing<\u002Fh1>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:15px;line-height:1.65;color:#4d6a7d;margin:0;\">A lot of what makes a toy usable is not the toy. It is the bracket that holds a switch at the angle a child can actually reach, the case that stops a battery interrupter being pulled apart, the mount that clamps to a wheelchair tray. Those parts are printed, and most of them are small enough to be printed by someone who already owns a printer and would rather use it for this.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height:240px;border:3px dashed #8c3312;border-radius:10px;background:#ffe3d5;background-image:radial-gradient(rgba(140,51,18,0.18) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#8c3312;text-align:center;\">Pixel art — isometric 3D printer, mid-print, filament spool<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:0.75fr 1.25fr;gap:40px;align-items:center;margin-top:36px;\">\n        <div style=\"height:180px;border:3px dashed #8c3312;border-radius:10px;background:#ffe3d5;background-image:radial-gradient(rgba(140,51,18,0.18) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#8c3312;text-align:center;\">Pixel art — makerspace counter, STL file handed to a printer operator<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:0 0 4px;\">You do not need a printer<\u002Fh2>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;margin:0;\">This is the part that already works, today, with no software from us. Ask a library, a makerspace, a men's shed, a school or a university — many have printers sitting idle and staff who would rather they made something like this than another keyring. Hand over the STL file from a guide and the settings from Printing basics; that is everything a printer operator needs.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:36px 0 4px;\">In this section<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Some of this is not built yet. Where it isn't, you can ask to be told when it is.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n        <sc-for list=\"{{ printingChildren }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"background:#ffe3d5;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:18px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:120px;border:2px dashed #8c3312;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8c3312;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#8c3312;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= LEARN ================= -->\n    <sc-if value=\"{{ isLearn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 14px;\">Learn<\u002Fh1>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:15px;line-height:1.65;color:#4d6a7d;max-width:70ch;margin:0;\">Adapting a toy is a small piece of electronics and a lot of judgement. These articles cover the judgement — what a switch does, which toys take to it, and how to hand the result over safely. For instructions on one particular toy, head to the Guides.<\u002Fp>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:32px 0 4px;\">Start here<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Read these three in order and you will know enough to adapt your first toy.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n        <sc-for list=\"{{ learnStart }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fdeecb;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:18px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:120px;border:2px dashed #7a4e05;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a4e05;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#7a4e05;margin:0;\">{{ item.label }}<\u002Fh3>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:32px 0 4px;\">Going deeper<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Reference material for when you are past the first one.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n        <sc-for list=\"{{ learnDeeper }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fdeecb;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:18px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:120px;border:2px dashed #7a4e05;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a4e05;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#7a4e05;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= GET INVOLVED ================= -->\n    <sc-if value=\"{{ isGetInvolved }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 14px;\">Get involved<\u002Fh1>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:15px;line-height:1.65;color:#4d6a7d;max-width:70ch;margin:0;\">SPLAT runs on unpaid work. Contributors adapt toys and write down how, people and organisations pass on toys they no longer need, and organisations put their name behind work so a parent knows someone competent read it. Any of those is a way in.<\u002Fp>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:32px 0 4px;\">Which one are you?<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Each of these walks through the whole path, start to finish.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n        <sc-for list=\"{{ involvedTracks }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"background:#bfe4f5;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:18px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:120px;border:2px dashed #0f6f9c;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0f6f9c;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#0f6f9c;margin:0;\">{{ item.label }}<\u002Fh3>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:32px 0 4px;\">Specific things you can do<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Smaller, more concrete. Some are not built yet — those say so.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n        <sc-for list=\"{{ involvedActions }}\" as=\"item\" hint-placeholder-count=\"4\">\n          <div style=\"background:#bfe4f5;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:16px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:100px;border:2px dashed #0f6f9c;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0f6f9c;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#0f6f9c;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:12px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= IMPACT ================= -->\n    <sc-if value=\"{{ isImpact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 14px;\">Community impact<\u002Fh1>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;max-width:70ch;margin:0 0 24px;\">Guides written, toys shared, and deliveries made by the people and organisations behind SPLAT. Guides here are counted once they are approved and public.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;\">\n        <sc-for list=\"{{ impactStats }}\" as=\"stat\" hint-placeholder-count=\"5\">\n          <div style=\"background:#d8ecf7;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:18px;text-align:center;\">\n            <div style=\"font-family:'Jersey 10',sans-serif;font-weight:700;font-size:28px;color:#0a4f70;\">{{ stat.count }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-top:6px;\">{{ stat.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:36px 0 4px;\">Contributors and organisations<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 20px;border:2px dashed #c6e0ed;border-radius:10px;background:#ffffff;margin-top:12px;\">\n        <span style=\"width:40px;height:40px;border-radius:50%;border:3px solid #4d6a7d;\"><\u002Fspan>\n        <p style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#12283a;margin:16px 0 0;\">No contributors yet.<\u002Fp>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;max-width:34ch;margin:6px 0 0;line-height:1.5;\">Check back soon — this page tracks guides, toys, and deliveries across the community.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:36px 0 4px;\">More in Impact<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">Some of this is not built yet. Those pages say so, and will take your email if you want to know when they are.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n        <sc-for list=\"{{ impactMore }}\" as=\"item\" hint-placeholder-count=\"4\">\n          <div style=\"background:#dcedf6;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:16px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:100px;border:2px dashed #0a4f70;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0a4f70;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#0a4f70;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:12px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= ABOUT ================= -->\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d6a7d;margin-bottom:18px;\">← Home<\u002Fa>\n\n      <div style=\"display:grid;grid-template-columns:1.25fr 0.75fr;gap:40px;align-items:center;\">\n        <div>\n          <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 14px;\">About SPLAT Connect<\u002Fh1>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:15px;line-height:1.65;color:#4d6a7d;margin:0;\">SPLAT stands for <strong style=\"color:#12283a;\">Supporting Play by Adapting Toys<\u002Fstrong>. We publish free instructions for modifying ordinary toys so that children with disabilities can operate them, and we connect the people who build them to the families who need them.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height:220px;border:3px dashed #4d6a7d;border-radius:10px;background:#dcedf6;background-image:radial-gradient(rgba(18,40,58,0.14) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#12283a;text-align:center;\">Pixel art — organisation illustration, small team at a workbench<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:0.75fr 1.25fr;gap:40px;align-items:center;margin-top:36px;\">\n        <div style=\"height:220px;border:3px dashed #4d6a7d;border-radius:10px;background:#dcedf6;background-image:radial-gradient(rgba(18,40,58,0.14) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#12283a;text-align:center;\">Pixel art — child pressing a big switch, adapted toy responding<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:0 0 6px;\">Why this exists<\u002Fh2>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;margin:0 0 10px;\">Play is how children learn that their actions change the world. A child who cannot press a small stiff button is shut out of that, not because the toy is too complex, but because the button is in the wrong place.<\u002Fp>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;margin:0;\">Purpose-built switch-adapted toys exist. They cost several times what the same toy costs off a shelf, and the range is narrow. Meanwhile the modification itself is often a two-dollar part and twenty minutes — if you know which two wires to touch. That knowledge is the bottleneck, and it is the thing this platform exists to remove.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.25fr 0.75fr;gap:40px;align-items:center;margin-top:36px;\">\n        <div>\n          <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:0 0 6px;\">How the platform works<\u002Fh2>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;margin:0;\">Contributors adapt a toy and write down how, in enough detail that a parent with no electronics experience can follow it. Organisations — therapy services, schools, disability services — review that work and put their name on it. Families follow the guides, or receive a toy someone has already adapted through the Toy Library.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height:180px;border:3px dashed #4d6a7d;border-radius:10px;background:#dcedf6;background-image:radial-gradient(rgba(18,40,58,0.14) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#12283a;text-align:center;\">Pixel art — contributor and organisation reviewer signing off a guide<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:0.75fr 1.25fr;gap:40px;align-items:center;margin-top:36px;\">\n        <div style=\"height:150px;border:3px dashed #4d6a7d;border-radius:10px;background:#dcedf6;background-image:radial-gradient(rgba(18,40,58,0.14) 1.4px, transparent 1.4px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;letter-spacing:.03em;text-transform:uppercase;color:#12283a;text-align:center;\">Pixel art — SPLAT badge / seal mark<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:0 0 6px;\">Who runs it<\u002Fh2>\n          <p style=\"font-family:'Nunito',sans-serif;font-size:14px;line-height:1.65;color:#4d6a7d;margin:0;\">SPLAT Connect is run by <em>[legal name to be confirmed]<\u002Fem>, based in <em>[city, state to be confirmed]<\u002Fem>. The platform is free to use and carries no advertising.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;\">\n            <span style=\"display:inline-flex;padding:12px 20px;background:#0f6f9c;color:#fff;border:3px solid #12283a;border-radius:8px;box-shadow:4px 4px 0 #12283a;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;\">Our team<\u002Fspan>\n            <span style=\"display:inline-flex;padding:12px 20px;background:#d8ecf7;color:#0a4f70;border:3px solid #12283a;border-radius:8px;box-shadow:4px 4px 0 #12283a;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;\">Contact us<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;color:#12283a;margin:36px 0 4px;\">More about SPLAT<\u002Fh2>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 16px;\">The team, how to reach us, and how to support what we do.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n        <sc-for list=\"{{ aboutMore }}\" as=\"item\" hint-placeholder-count=\"4\">\n          <div style=\"background:#ffffff;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:16px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:100px;border:2px dashed #12283a;border-radius:6px;background:#eaf4fa;display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#12283a;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#12283a;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:12px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= MY SPLAT (DASHBOARD) ================= -->\n    <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:min(90%,1400px);margin:0 auto;padding:36px 0 80px;\">\n      <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;letter-spacing:-0.02em;color:#12283a;margin:0 0 12px;\">My SPLAT<\u002Fh1>\n      <p style=\"font-family:'Nunito',sans-serif;font-size:15px;line-height:1.65;color:#4d6a7d;max-width:60ch;margin:0 0 26px;\">Everything that belongs to you — what you have written, what you have lent, and what you have asked for.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n        <sc-for list=\"{{ dashboardItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <div style=\"background:#d8ecf7;border:3px solid #12283a;border-radius:10px;box-shadow:5px 5px 0 #12283a;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:104px;\">\n            <div style=\"height:84px;border:2px dashed #0a4f70;border-radius:6px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0a4f70;\">Pixel art<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <h3 style=\"font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#0a4f70;margin:0;\">{{ item.label }}<\u002Fh3>\n              <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;padding:2px 7px;background:#fdeecb;border:1px solid #7a4e05;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#7a4e05;\">SOON<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-family:'Nunito',sans-serif;font-size:12px;color:#4d6a7d;margin:0;line-height:1.5;\">{{ item.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= SIGN IN / SIGN UP (bare) ================= -->\n    <sc-if value=\"{{ isAuth }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:10px;margin-bottom:30px;\">\n        <span style=\"width:34px;height:34px;border-radius:8px;background:#d8ecf7;border:2px solid #12283a;display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"18\" height=\"10\" sc-camel-view-box=\"0 0 18 10\"><circle cx=\"3\" cy=\"5\" r=\"2.6\" fill=\"none\" stroke=\"#0a4f70\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"5\" r=\"2.6\" fill=\"none\" stroke=\"#0a4f70\" stroke-width=\"1.6\"><\u002Fcircle><line x1=\"5.6\" y1=\"5\" x2=\"12.4\" y2=\"5\" stroke=\"#0a4f70\" stroke-width=\"1.6\"><\u002Fline><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;letter-spacing:-0.01em;color:#12283a;\">SPLAT Connect<\u002Fspan>\n      <\u002Fa>\n\n      <div style=\"display:inline-flex;border:3px solid #12283a;border-radius:8px;overflow:hidden;box-shadow:4px 4px 0 #12283a;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showLogin }}\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:10px 18px;border:none;cursor:pointer;background:{{ loginTabBg }};color:{{ loginTabFg }};\">Sign in<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ showSignup }}\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:10px 18px;border:none;border-left:2px solid #12283a;cursor:pointer;background:{{ signupTabBg }};color:{{ signupTabFg }};\">Create account<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isLoginView }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:3px solid #12283a;border-radius:10px;box-shadow:6px 6px 0 #12283a;padding:30px;width:100%;max-width:380px;margin-top:22px;\">\n        <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:#12283a;margin:0 0 20px;\">Sign in<\u002Fh1>\n        <label style=\"display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#12283a;\">Email<\u002Flabel>\n        <input type=\"email\" disabled=\"\" style=\"display:block;width:100%;padding:10px 12px;border:2px solid #12283a;border-radius:6px;font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 16px;background:#fff;color:#12283a;\">\n        <label style=\"display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#12283a;\">Password<\u002Flabel>\n        <input type=\"password\" disabled=\"\" style=\"display:block;width:100%;padding:10px 12px;border:2px solid #12283a;border-radius:6px;font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 20px;background:#fff;color:#12283a;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goDashboard }}\" style=\"display:block;width:100%;padding:13px;background:#ff8f5e;border:3px solid #12283a;border-radius:8px;box-shadow:4px 4px 0 #12283a;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#12283a;cursor:pointer;\">Sign in<\u002Fbutton>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;text-align:center;margin:16px 0 0;\">New here? <a href=\"#\" sc-camel-on-click=\"{{ showSignup }}\" style=\"color:#0a4f70;font-weight:700;\">Create an account<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSignupView }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:3px solid #12283a;border-radius:10px;box-shadow:6px 6px 0 #12283a;padding:30px;width:100%;max-width:380px;margin-top:22px;\">\n        <h1 style=\"font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:#12283a;margin:0 0 6px;\">Create your account<\u002Fh1>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:0 0 18px;\">One account for everything — browse, contribute, and manage your child's profile.<\u002Fp>\n        <label style=\"display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#12283a;\">Full name<\u002Flabel>\n        <input type=\"text\" disabled=\"\" style=\"display:block;width:100%;padding:10px 12px;border:2px solid #12283a;border-radius:6px;font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 14px;background:#fff;color:#12283a;\">\n        <label style=\"display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#12283a;\">Email<\u002Flabel>\n        <input type=\"email\" disabled=\"\" style=\"display:block;width:100%;padding:10px 12px;border:2px solid #12283a;border-radius:6px;font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 14px;background:#fff;color:#12283a;\">\n        <label style=\"display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#12283a;\">Password<\u002Flabel>\n        <input type=\"password\" disabled=\"\" style=\"display:block;width:100%;padding:10px 12px;border:2px solid #12283a;border-radius:6px;font-family:'Nunito',sans-serif;font-size:14px;margin:6px 0 14px;background:#fff;color:#12283a;\">\n        <label style=\"display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;margin:6px 0 18px;\">\n          <span style=\"width:18px;height:18px;border:2px solid #12283a;border-radius:4px;display:inline-block;\"><\u002Fspan>\n          Read and accept the contributor terms\n        <\u002Flabel>\n        <button type=\"button\" sc-camel-on-click=\"{{ goDashboard }}\" style=\"display:block;width:100%;padding:13px;background:#ff8f5e;border:3px solid #12283a;border-radius:8px;box-shadow:4px 4px 0 #12283a;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#12283a;cursor:pointer;\">Create account<\u002Fbutton>\n        <p style=\"font-family:'Nunito',sans-serif;font-size:13px;color:#4d6a7d;text-align:center;margin:16px 0 0;\">Already have an account? <a href=\"#\" sc-camel-on-click=\"{{ showLogin }}\" style=\"color:#0a4f70;font-weight:700;\">Sign in<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'home', authView: 'login' };\n\n  go(name) {\n    return (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ screen: name }); };\n  }\n\n  renderVals() {\n    const s = this.state.screen;\n    return {\n      showChrome: s !== 'auth',\n      isHome: s === 'home',\n      isGuides: s === 'guides',\n      isToyLibrary: s === 'toylibrary',\n      isPrinting: s === 'printing',\n      isLearn: s === 'learn',\n      isGetInvolved: s === 'getinvolved',\n      isImpact: s === 'impact',\n      isAbout: s === 'about',\n      isDashboard: s === 'dashboard',\n      isAuth: s === 'auth',\n      isLoginView: this.state.authView === 'login',\n      isSignupView: this.state.authView === 'signup',\n      loginTabBg: this.state.authView === 'login' ? '#12283a' : '#ffffff',\n      loginTabFg: this.state.authView === 'login' ? '#ffffff' : '#12283a',\n      signupTabBg: this.state.authView === 'signup' ? '#12283a' : '#ffffff',\n      signupTabFg: this.state.authView === 'signup' ? '#ffffff' : '#12283a',\n\n      goHome: this.go('home'),\n      goGuides: this.go('guides'),\n      goToyLibrary: this.go('toylibrary'),\n      goPrinting: this.go('printing'),\n      goLearn: this.go('learn'),\n      goGetInvolved: this.go('getinvolved'),\n      goImpact: this.go('impact'),\n      goAbout: this.go('about'),\n      goDashboard: this.go('dashboard'),\n      goSignOut: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ screen: 'auth', authView: 'login' }); },\n      showLogin: () => this.setState({ authView: 'login' }),\n      showSignup: () => this.setState({ authView: 'signup' }),\n\n      learnStart: [\n        { label: 'Toy adaptation 101', blurb: 'What a battery interrupter is, and why it is the whole trick.' },\n        { label: 'Switch types explained', blurb: 'Buttons, levers, proximity and grasp — which suits which child.' },\n        { label: 'Choosing a toy to adapt', blurb: 'What makes a toy easy to adapt, and what makes it impossible.' },\n      ],\n      learnDeeper: [\n        { label: 'Tools and materials', blurb: 'The shopping list, and what you can borrow instead of buying.' },\n        { label: 'Safety and cleaning', blurb: 'Batteries, small parts, and getting a toy ready to hand over.' },\n        { label: 'Ask an expert', blurb: 'Put a question to an occupational therapist or a maker.', soon: true },\n      ],\n      involvedTracks: [\n        { label: 'For families', blurb: 'Find a guide, gather the parts, adapt the toy you already own.' },\n        { label: 'For contributors', blurb: 'Adapt a toy, write it up, and get an organisation behind it.' },\n        { label: 'For organisations', blurb: 'Back contributors, hold toys for local families, host a build day.' },\n      ],\n      involvedActions: [\n        { label: 'Submit an idea', blurb: 'Suggest a toy worth adapting, even if you cannot build it.' },\n        { label: 'Submit a guide', blurb: 'What writing up an adaptation involves, start to finish.' },\n        { label: 'Adaptation requests', blurb: 'Ask for a toy to be adapted, and let a maker nearby claim it.', soon: true },\n        { label: 'Design challenges', blurb: 'Problems nobody has solved yet, open to anyone.' },\n      ],\n      impactStats: [\n        { label: 'Guides', count: 2 },\n        { label: 'Toys shared', count: 1 },\n        { label: 'Toys delivered', count: 1 },\n        { label: 'Contributors', count: 3 },\n        { label: 'Organisations', count: 1 },\n      ],\n      impactMore: [\n        { label: 'Organisations', blurb: 'The therapy centres, schools and services standing behind the work.' },\n        { label: 'News and stories', blurb: 'What families and makers have done with SPLAT.', soon: true },\n        { label: 'Events', blurb: 'Build days, workshops and where to find us in person.', soon: true },\n        { label: 'Deliveries map', blurb: 'Where adapted toys have actually landed.', soon: true },\n      ],\n      aboutMore: [\n        { label: 'Our team', blurb: 'The people behind the platform.' },\n        { label: 'Contact', blurb: 'Get in touch about a guide, a toy or a partnership.' },\n        { label: 'Partners and supporters', blurb: 'The organisations and funders making this possible.', soon: true },\n        { label: 'Support SPLAT', blurb: 'Ways to help beyond building a toy.', soon: true },\n      ],\n      printingChildren: [\n        { label: 'Printing basics', blurb: 'Filament, settings and finishing for printed switch parts.' },\n        { label: 'Request a print', blurb: 'Ask an association with a free printer to make a part for you.', soon: true },\n        { label: 'Printable parts', blurb: 'A catalogue of STL files, sized and tested for adaptation work.', soon: true },\n      ],\n      dashboardItems: [\n        { label: 'My tutorials', blurb: 'Your adaptation guides, and where each one is in review.' },\n        { label: 'My toys', blurb: 'Toys you have listed for other families.' },\n        { label: 'Exchanges', blurb: '2 waiting on you.' },\n        { label: 'Design challenges', blurb: 'Ideas you have submitted, and challenges you have joined.' },\n        { label: 'Submit an idea', blurb: 'Suggest a toy worth adapting, even if you cannot build it yourself.' },\n        { label: 'My print requests', blurb: 'Parts you have asked someone to print.', soon: true },\n        { label: 'Notifications', blurb: '3 unread.' },\n        { label: 'Account', blurb: 'Your name, email, and the children and terms you have on file.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
