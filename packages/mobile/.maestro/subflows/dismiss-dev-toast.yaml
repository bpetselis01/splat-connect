appId: com.splatconnect.mobile
---
# A dev-client build floats a LogBox "Open debugger to view warnings." toast
# over the tab bar, and a tap on "Me" lands on it instead. A release build never
# shows it, so this is a no-op there. The X sits at the toast's right end.
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "92%,93%"
