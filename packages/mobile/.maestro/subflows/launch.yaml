appId: com.splatconnect.mobile
---
# clearState must not appear on this relaunch path: this subflow is also run
# after `stopApp` to simulate a cold start, and clearing state there would wipe
# the SecureStore entry that is the entire subject of the suite.
- launchApp

# No landing assertion here on purpose: this subflow is run both signed out
# (lands on sign-in) and after a stopApp with a live session (lands on Guides),
# so there is no one string true of both. Each flow asserts its own landing on
# the line after `runFlow`.
