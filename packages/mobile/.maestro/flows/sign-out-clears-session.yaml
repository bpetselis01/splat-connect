# journeys: Z04
# DEVICE_EMAIL / DEVICE_PASSWORD come from `maestro test --env`, fed by
# scripts/provision-device-parent.mjs. Deliberately NOT declared in an `env:`
# block here: a flow-level `env:` default WINS over --env (measured 2026-07-26 —
# both flows typed the literal placeholder and failed with "Invalid login
# credentials"). With no default, an unset variable fails loudly instead.
appId: com.splatconnect.mobile
---
# Establishes a signed-out precondition at flow start: both flows run in one
# `maestro test` session against one device, so without this a prior flow's
# signed-in state leaks in. Never add this to the relaunch path below — that
# would wipe the SecureStore entry this suite exists to test.
- clearState
- runFlow: ../subflows/launch.yaml
# On iOS clearState wipes app data but NOT the Keychain, where the session
# lives, so a prior run can leave this launch already signed in. Sign in only
# when Welcome is actually showing.
- runFlow:
    when:
      visible:
        id: "welcome-sign-in"
    commands:
      - tapOn:
          id: "welcome-sign-in"
      # Addressed by testID rather than text: TextField renders its label as a
      # sibling <Text> carrying the same string as the input's accessibilityLabel.
      - tapOn:
          id: "email-input"
      - inputText: ${DEVICE_EMAIL}
      - tapOn: "Welcome back"  # the keyboard covers the password field
      - tapOn:
          id: "password-input"
      - inputText: ${DEVICE_PASSWORD}
      # hideKeyboard fails on the iOS 26 simulator; a tap outside a field
      # dismisses it on device and simulator alike (ScrollView default).
      - tapOn: "Welcome back"
      - tapOn:
          id: "auth-submit"
      - tapOn:
          text: "Not Now"
          optional: true

# Sign Out lives on Account, a row in the Me tab's Account group. The tab's
# label carries a count while anything is waiting, so match it with a suffix.
# Signed in lands on Home; let it settle before reaching for the tab bar.
- extendedWaitUntil:
    visible:
      text: "Guides"
    timeout: 15000
- runFlow: ../subflows/dismiss-dev-toast.yaml
- tapOn:
    text: "Me(, .*)?"
# Me draws nothing until its capabilities load; its first row is the marker.
- extendedWaitUntil:
    visible:
      text: "Add a tutorial"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Account"
# "Account" is also the group's eyebrow, which comes first; the row is second.
- tapOn:
    text: "Account"
    index: 1
- scrollUntilVisible:
    element:
      text: "Sign Out"
- tapOn:
    text: "Sign Out"
- assertVisible:
    id: "welcome-sign-in"

# The point of the flow: the cleared state must be what persisted, not just what
# is on screen. secureStoreAdapter.removeItem has to have actually deleted the key.
- stopApp
- runFlow: ../subflows/launch.yaml
# No tab to tap first: a signed-out launch lands on Welcome.
- assertVisible:
    id: "welcome-sign-in"
- assertNotVisible:
    text: "Child profile"
