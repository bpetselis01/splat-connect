# The guide page on Hermes and a real touch screen: the hero's paging, build
# mode (a fullScreenModal), and the header ✕ that closes the whole trail back
# to the last screen with the tab bar. Playwright draws the same screens but
# cannot swipe a native pager, present a native modal, or show the tab bar's
# real hiding rules; tests/e2e/guides-*.spec.ts cover the behaviour, this
# covers the platform.
#
# The guide is seeded by scripts/provision-device-parent.mjs (two photos, two
# steps and one STL part), the same way toy-photos-carousel.yaml gets its toy: whether the first
# guide in the library happens to have two photos is someone else's upload.
#
# DEVICE_EMAIL / DEVICE_PASSWORD / DEVICE_GUIDE_TITLE come from `maestro test --env` — see
# sign-out-clears-session.yaml for why they carry no env: defaults here.
name: "B01 B05 G05 G15 G30 G31 Open a guide, build it, view a part in 3D, and close the trail"
appId: com.splatconnect.mobile
---
- clearState
- runFlow: ../subflows/launch.yaml
# Signs in unless the Keychain still holds a session (see sign-in.yaml).
- runFlow: ../subflows/sign-in.yaml

# Searches the library for the seeded guide (DEVICE_GUIDE_TITLE): a long-lived
# database holds hundreds of guides.
- runFlow: ../subflows/open-device-guide.yaml
- runFlow: ../subflows/dismiss-dev-toast.yaml

# The hero opens on its first photo; the pill counts them.
- assertVisible:
    text: "1/2 · .*"
- assertNotVisible:
    text: "2/2 · .*"

# Swiping is the assertion, as in toy-photos-carousel.yaml: if pagingEnabled or
# the scroll handler threw on Hermes, the second photo never arrives. Explicit
# points, because the hero is the top of a vertical scroll and a centre swipe
# would land on the page below it.
- swipe:
    start: "85%,30%"
    end: "15%,30%"
- assertVisible:
    text: "2/2 · .*"
- swipe:
    start: "15%,30%"
    end: "85%,30%"
- assertVisible:
    text: "1/2 · .*"

# G11: a tap on the hero opens the photo viewer (a native modal, so Playwright
# cannot show it); its own close control puts the guide back.
- tapOn:
    text: "Open photo 1 full screen"
- assertVisible:
    text: "Close photo"
- assertVisible:
    text: "1 of 2"
- tapOn:
    text: "Close photo"
- assertVisible:
    text: "1/2 · .*"

# Build mode: Get ready, then step 1, then step 2.
- tapOn:
    text: "Start building"
- assertVisible:
    text: "Get ready"
- tapOn:
    text: "Start step 1"
- assertVisible:
    text: "Step 1 of 2"
- tapOn:
    text: "Next"
- assertVisible:
    text: "Step 2 of 2"

# Its own ✕ closes the modal onto the guide, which now offers to pick up where
# the reader stopped (Next ticked step 1).
- tapOn:
    text: "Close build mode"
- assertVisible:
    text: "Pick up at step 2"

# The 3D viewer is the WebView + three.js on Hermes and a real GPU: Playwright
# draws the shell only. The device guide is seeded with one STL.
# The section tabs sit below the hero and the intro.
- scrollUntilVisible:
    element:
      text: "Files"
- tapOn:
    text: "Files"
- scrollUntilVisible:
    element:
      text: "3D view of Device base"
- tapOn:
    text: "3D view of Device base"
- assertVisible:
    text: "Drag to turn · pinch to zoom"
- assertVisible:
    text: "Ask someone to print"
- assertNotVisible:
    text: "Couldn't load this part."
- tapOn:
    text: "Close 3D view"
- assertVisible:
    text: "Guide files"

- tapOn:
    text: "Overview"

# The header ✕ closes the whole trail: back on the library, tab bar showing.
- tapOn:
    text: "Close"
- assertVisible:
    text: "Guide library"
- assertVisible:
    text: "Home"
- assertVisible:
    text: "Inbox(, .*)?"
- assertNotVisible:
    text: "Pick up at step 2"

# G31: Ask someone to print leaves the viewer for the printer finder. The viewer
# is a fullScreenModal, and a screen pushed from inside it opened underneath on
# iOS and never showed, so this has to be seen on a device. Its ✕ closes back to the
# library.
- runFlow: ../subflows/open-device-guide.yaml
- runFlow: ../subflows/dismiss-dev-toast.yaml
- scrollUntilVisible:
    element:
      text: "Files"
- tapOn:
    text: "Files"
- scrollUntilVisible:
    element:
      text: "3D view of Device base"
- tapOn:
    text: "3D view of Device base"
- tapOn:
    text: "Ask someone to print"
- extendedWaitUntil:
    visible:
      text: "Find a printer"
    timeout: 10000
# The finder was opened for this guide, not empty-handed.
- assertVisible:
    text: ${DEVICE_GUIDE_TITLE}
- tapOn:
    text: "Close"
- assertVisible:
    text: "Guide library"
