# The photo carousel on Hermes. Jest renders it with react-test-renderer, which
# runs neither `pagingEnabled` (the platform's own paging — the whole reason
# mobile needed no gesture library) nor the Reanimated worklet that drives the
# dots. This is the only layer that executes either.
#
# The toy is seeded by scripts/provision-device-parent.mjs rather than picked
# out of the library: whether the first toy on the shelf happens to carry two
# photos is someone else's upload, not a property of this build.
#
# DEVICE_EMAIL / DEVICE_PASSWORD come from `maestro test --env` — see
# sign-out-clears-session.yaml for why they carry no env: defaults here.
name: "Y03 Y04 Open a toy from the library and page through its photos"
appId: com.splatconnect.mobile
---
- clearState
- runFlow: ../subflows/launch.yaml
# Signs in unless the Keychain still holds a session (see sign-in.yaml).
- runFlow: ../subflows/sign-in.yaml
- runFlow: ../subflows/dismiss-dev-toast.yaml

- tapOn:
    text: "Toys"
- assertVisible:
    text: "Toy library"

- tapOn:
    text: "Device smoke toy.*"

# The carousel opens on the cover. Each photo is a button labelled with its
# number (the "Shows the switch" flag sits inside the second one, so it is not
# a separate element), so which one is showing says which page the pager is on.
- assertVisible:
    text: "Device smoke toy.*"
- assertVisible:
    text: "Open photo 1 full screen"
- assertNotVisible:
    text: "Open photo 2 full screen"

# Swiping is the assertion: if pagingEnabled or the scroll handler threw on
# Hermes, the second photo never arrives.
# Explicit points: the hero is the top of a vertical scroll, and a centre swipe
# lands below it.
- swipe:
    start: "85%,30%"
    end: "15%,30%"
- assertVisible:
    text: "Open photo 2 full screen"
- assertNotVisible:
    text: "Open photo 1 full screen"

# And back, so a one-way scroll that cannot return still fails here.
- swipe:
    start: "15%,30%"
    end: "85%,30%"
- assertVisible:
    text: "Open photo 1 full screen"
- assertNotVisible:
    text: "Open photo 2 full screen"
