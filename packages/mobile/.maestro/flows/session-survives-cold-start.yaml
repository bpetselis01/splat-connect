# DEVICE_EMAIL / DEVICE_PASSWORD come from `maestro test --env`, fed by
# scripts/provision-device-parent.mjs. Deliberately NOT declared in an `env:`
# block here: a flow-level `env:` default WINS over --env (measured 2026-07-26 —
# both flows typed the literal placeholder and failed with "Invalid login
# credentials"). With no default, an unset variable fails loudly instead.
appId: com.splatconnect.mobile
---
# Establishes a signed-out precondition at flow start: both flows run in one
# `maestro test` session against one device, so without this a prior flow's
# signed-in state leaks in. Never add this to the relaunch path below — that
# would wipe the SecureStore entry this suite exists to test.
- clearState
- runFlow: ../subflows/launch.yaml

# The app now lives behind sign-in — a signed-out launch lands directly on
# the sign-in screen. Button sets accessibilityLabel={label}, so "Sign In"
# etc. are addressable by text. TextField renders its label as a sibling
# <Text> with the same string as the input's own accessibilityLabel, so
# "Email"/"Password" match two nodes — target the inputs by testID instead.
- assertVisible:
    text: "Welcome Back"
- tapOn:
    id: "email-input"
- inputText: ${DEVICE_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${DEVICE_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign In"

# A signed-in visitor lands on the Guides tab.
- assertVisible:
    text: "Guides"

# The actual test: kill the process, then cold-start again. Anything held only in
# React state or memory is gone; only what secureStoreAdapter wrote survives.
- stopApp
- runFlow: ../subflows/launch.yaml

# Still signed in — no sign-in form. Asserting the form is absent matters as much
# as asserting the home is present: a half-restored session could render both.
- assertVisible:
    text: "Guides"
- assertNotVisible:
    text: "Welcome Back"
