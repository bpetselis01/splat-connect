appId: com.splatconnect.mobile
env:
  DEVICE_EMAIL: set-by-maestro-test---env
  DEVICE_PASSWORD: set-by-maestro-test---env
---
# Establishes a signed-out precondition at flow start: flows run alphabetically
# in one `maestro test` session, so without this a prior flow's signed-in state
# leaks in. Never add this to the relaunch path below — that would wipe the
# SecureStore entry this suite exists to test.
- clearState
- runFlow: ../subflows/launch.yaml

# Sign in on the Profile tab. Button sets accessibilityLabel={label}, so
# "Sign In" etc. are addressable by text. TextField renders its label as a
# sibling <Text> with the same string as the input's own accessibilityLabel,
# so "Email"/"Password" match two nodes — target the inputs by testID instead.
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Welcome Back"
- tapOn:
    id: "email-input"
- inputText: ${DEVICE_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${DEVICE_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign In"

# A parent with role resolved from GET /api/contributors/me lands on
# ChildProfileHome (app/(tabs)/profile/index.tsx), not the "Signed in as" card.
- assertVisible:
    text: "Child profile"
- assertVisible:
    text: "Customization Metrics"

# The actual test: kill the process, then cold-start again. Anything held only in
# React state or memory is gone; only what secureStoreAdapter wrote survives.
- stopApp
- runFlow: ../subflows/launch.yaml
- tapOn:
    text: "Profile"

# Still signed in — no sign-in form. Asserting the form is absent matters as much
# as asserting the home is present: a half-restored session could render both.
- assertVisible:
    text: "Child profile"
- assertNotVisible:
    text: "Welcome Back"
