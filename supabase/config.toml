# Local Supabase CLI config. Only overrides live here — every key the CLI
# defaults correctly has been removed, so `supabase --help` / the upstream
# template is the reference for anything not listed. Local only; the hosted
# project is configured in the dashboard.
project_id = "splat-connect"

[auth]
site_url = "http://127.0.0.1:3000"
# 3100 is the E2E web server; the wildcards let Playwright land on any path.
additional_redirect_urls = ["https://127.0.0.1:3000", "http://localhost:3100/**", "http://127.0.0.1:3100/**"]

[auth.rate_limit]
# Raised from the default of 2. The mobile E2E suite creates a user per test
# (~14 signups per run), so at the default a second run inside the hour fails
# most specs with "email rate limit exceeded" — which reads like a broken app
# rather than a spent quota.
email_sent = 1000

[auth.email]
enable_confirmations = true

# 6-digit codes for the mobile app (docs/superpowers/specs/2026-09-30-mobile-sign-in-design.md).
# Each template carries the code AND the link, so web's link flow is unchanged.
# The hosted project is configured by pasting the same files into the dashboard.
[auth.email.template.confirmation]
subject = "Your SPLAT Connect code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your SPLAT Connect sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your SPLAT Connect password"
content_path = "./supabase/templates/recovery.html"

# Off because the Logflare backend writes a row per request into the same
# database volume, and nothing prunes it: three days of local development and
# E2E runs left 910k rows across two _analytics.log_events_* tables, 1.1GB of a
# 1.6GB volume, against 27MB of actual application data. A full E2E pass alone
# makes ~17k auth requests, so the growth tracks test runs rather than use.
# The cost is Studio's Logs tab; container output (`docker logs
# supabase_auth_splat-connect`) is untouched and is what debugging leans on.
[analytics]
enabled = false

# Nothing uses S3-protocol access or vector buckets; off is two fewer surfaces.
[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

# No supabase/functions/ directory — nothing to serve.
[edge_runtime]
enabled = false

# PENDING(apple-sign-in): for local testing of native Apple sign-in add
#   [auth.external.apple] enabled = true, client_id = "com.splatconnect.mobile"
# PENDING(google-sign-in): and
#   [auth.external.google] enabled = true, client_id = "<web client id>",
#   skip_nonce_check = true   (iOS Google tokens carry a nonce the app cannot supply)
# The hosted project is switched on in the dashboard (scripts/setup-mobile-sign-in.sh).
# PENDING(email-delivery): the hosted project also needs custom SMTP (Resend);
# the built-in sender reaches only the project team, 2 emails an hour.
