name: CI

# `push` without a branch filter meant every push to a branch with an open PR
# ran this workflow twice — once for `push`, once for `pull_request` — for
# identical coverage at double the runner minutes. PR branches are covered by
# the `pull_request` trigger; `push` now only fires for merges to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled rather than left to finish. Pushing three
# commits in a row now costs one full suite instead of three. Merges to main
# are exempt: every commit that lands should get a complete, recorded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which packages did this push/PR actually touch? Each of the three heavy
  # jobs below boots its own local Supabase — roughly two minutes of Docker
  # before a single test runs — so skipping the ones that cannot be affected
  # is the largest saving available in a monorepo. Shared paths (api, types,
  # supabase, the lockfile, this file) deliberately trigger everything.
  changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/api/**'
              - 'packages/types/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            api: *shared
            web:
              - *shared
              - 'packages/web/**'
            mobile:
              - *shared
              - 'packages/mobile/**'

  check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Type check all packages
        run: pnpm -r typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Test API
        run: pnpm --filter @splat-connect/api test:unit

      - name: Test Web
        run: pnpm --filter @splat-connect/web test:unit

      - name: Test Mobile
        run: pnpm --filter @splat-connect/mobile test:unit

  integration:
    name: Integration Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      - name: Run integration tests
        run: pnpm --filter @splat-connect/api test:integration

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  mobile-e2e:
    name: Mobile E2E Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      # The Expo web app + API servers are started by Playwright's webServer
      # (see packages/mobile/playwright.config.ts) and pointed at local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/mobile exec playwright install --with-deps chromium

      - name: Run mobile E2E tests
        run: pnpm --filter @splat-connect/mobile test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  web-e2e:
    name: Web E2E Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      # The API + Next.js production build are started by Playwright's
      # webServer (see packages/web/playwright.config.ts) and pointed at
      # local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/web exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm --filter @splat-connect/web test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # The three suites above run against an ephemeral local Supabase, so they can
  # never notice that a committed migration was never pushed to the real project
  # — which is exactly how 032/033 shipped in code while production stayed on the
  # old schema (toys.owner_org_id missing, Toy Library and Exchanges 500ing).
  # This job talks to the linked remote and fails a merge that left migrations
  # unpushed.
  #
  # It used to `exit 0` whenever the deploy secrets were absent. On a repo where
  # they were never configured that is indistinguishable from passing, and it is
  # how this job reported green while the cloud project was missing the
  # profiles_freeze_identity trigger — the 2026-08-28 pentest escalated an
  # ordinary account to admin through exactly that gap. A check that cannot run
  # must now say so loudly. Forks are the one legitimate case: this repo is
  # public and a fork PR genuinely cannot read secrets, so it still skips there
  # and nowhere else.
  migration-drift:
    name: Migration Drift
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Check remote migration drift
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "Fork PR — deploy secrets are unavailable by design. Skipping."
              exit 0
            fi
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF are not configured." >&2
            echo "This check cannot verify the remote, so it fails rather than passes silently." >&2
            echo "Set them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          bash scripts/check-migration-drift.sh

      # The ledger check above cannot see a migration that was marked applied
      # without being executed (`supabase migration repair --status applied`),
      # because the ledger row is written in full either way. That is the actual
      # 2026-08-28 root cause: 009 read as applied, statements and all, while
      # none of its three objects existed. This asserts the objects themselves.
      - name: Check security-critical schema guards
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            [ "$IS_FORK" = "true" ] && exit 0
            exit 1
          fi
          bash scripts/check-schema-guards.sh
