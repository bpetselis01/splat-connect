name: CI

# `push` without a branch filter meant every push to a branch with an open PR
# ran this workflow twice — once for `push`, once for `pull_request` — for
# identical coverage at double the runner minutes. PR branches are covered by
# the `pull_request` trigger; `push` now only fires for merges to main.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled rather than left to finish. Pushing three
# commits in a row now costs one full suite instead of three. Merges to main
# are exempt: every commit that lands should get a complete, recorded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which packages did this push/PR actually touch? Each of the three heavy
  # jobs below boots its own local Supabase — roughly two minutes of Docker
  # before a single test runs — so skipping the ones that cannot be affected
  # is the largest saving available in a monorepo. Shared paths (api, types,
  # supabase, the lockfile, this file) deliberately trigger everything.
  changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/api/**'
              - 'packages/types/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            api: *shared
            web:
              - *shared
              - 'packages/web/**'
            mobile:
              - *shared
              - 'packages/mobile/**'

  check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check all packages
        run: pnpm -r typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Test API
        run: pnpm --filter @splat-connect/api test:unit

      - name: Test Web
        run: pnpm --filter @splat-connect/web test:unit

      - name: Test Mobile
        run: pnpm --filter @splat-connect/mobile test:unit

  integration:
    name: Integration Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: 'latest' resolves via an unauthenticated GitHub API call
          # that gets rate-limited on shared runners, and CLI behavior drift
          # has bitten before (see migration 004). Bump deliberately.
          version: 2.109.1

      # 54320-54329 sit inside the runner's ephemeral port range
      # (net.ipv4.ip_local_port_range = 32768 60999), so the kernel can hand
      # 54322 to an outbound socket — the image pulls above open dozens — and
      # Docker then fails to publish it: "address already in use".
      - name: Reserve Supabase ports from the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start local Supabase
        run: supabase start

      - name: Run integration tests
        run: pnpm --filter @splat-connect/api test:integration

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  mobile-e2e:
    name: Mobile E2E Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # 54320-54329 sit inside the runner's ephemeral port range
      # (net.ipv4.ip_local_port_range = 32768 60999), so the kernel can hand
      # 54322 to an outbound socket — the image pulls above open dozens — and
      # Docker then fails to publish it: "address already in use".
      - name: Reserve Supabase ports from the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start local Supabase
        run: supabase start

      # The Expo web app + API servers are started by Playwright's webServer
      # (see packages/mobile/playwright.config.ts) and pointed at local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/mobile exec playwright install --with-deps chromium

      - name: Run mobile E2E tests
        run: pnpm --filter @splat-connect/mobile test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  web-e2e:
    name: Web E2E Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # 54320-54329 sit inside the runner's ephemeral port range
      # (net.ipv4.ip_local_port_range = 32768 60999), so the kernel can hand
      # 54322 to an outbound socket — the image pulls above open dozens — and
      # Docker then fails to publish it: "address already in use".
      - name: Reserve Supabase ports from the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start local Supabase
        run: supabase start

      # The API + Next.js production build are started by Playwright's
      # webServer (see packages/web/playwright.config.ts) and pointed at
      # local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/web exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm --filter @splat-connect/web test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
