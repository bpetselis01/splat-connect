name: CI

# `push` without a branch filter meant every push to a branch with an open PR
# ran this workflow twice — once for `push`, once for `pull_request` — for
# identical coverage at double the runner minutes. So `push` is filtered to the
# two branches that are not otherwise covered: main, and development, which
# takes direct pushes between PRs. A feature branch with an open PR is still
# covered once, by `pull_request`.
on:
  push:
    # `development` is here because work lands on it directly between PRs, and a
    # push with no open PR used to run nothing at all. Roughly nine commits of
    # the photo-array line reached the shared branch that way in September 2026;
    # by the time anything ran them, 33 of 77 mobile E2E tests were dying in
    # setup on a generated-column write. The concurrency group below still
    # cancels superseded runs here — only main is exempt from that.
    branches: [main, development]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled rather than left to finish. Pushing three
# commits in a row now costs one full suite instead of three. Merges to main
# are exempt: every commit that lands should get a complete, recorded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which packages did this push/PR actually touch? Each of the three heavy
  # jobs below boots its own local Supabase — roughly two minutes of Docker
  # before a single test runs — so skipping the ones that cannot be affected
  # is the largest saving available in a monorepo. Shared paths (api, types,
  # supabase, the lockfile, this file) deliberately trigger everything.
  changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    # On a pull_request event paths-filter reads the PR's file list through the API,
    # which the default read-only token refuses ("Resource not accessible by integration").
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/api/**'
              - 'packages/types/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            api: *shared
            web:
              - *shared
              - 'packages/web/**'
            mobile:
              - *shared
              - 'packages/mobile/**'

  check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Type check all packages
        run: pnpm -r typecheck

      - name: Journey map
        run: pnpm test:journeys:unit && pnpm test:journeys

      # The parity harness itself needs seeded stacks and cannot run here, but
      # its pure parts can: comparison maths, fingerprints, and the app-map
      # drift check (every board route must be a file in packages/mobile/app).
      # fingerprint.test.js runs collectFingerprint in a real page, so this job
      # needs the browser the e2e jobs install.
      - name: Install Playwright Chromium
        run: pnpm --filter @splat-connect/web exec playwright install --with-deps chromium

      - name: Parity harness unit tests
        run: pnpm test:parity:unit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Test API
        run: pnpm --filter @splat-connect/api test:unit

      - name: Test Web
        run: pnpm --filter @splat-connect/web test:unit

      - name: Test Mobile
        run: pnpm --filter @splat-connect/mobile test:unit

  integration:
    name: Integration Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      - name: Run integration tests
        run: pnpm --filter @splat-connect/api test:integration

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  mobile-e2e:
    name: Mobile E2E Tests
    needs: [changes, check, test]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      # The Expo web app + API servers are started by Playwright's webServer
      # (see packages/mobile/playwright.config.ts) and pointed at local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/mobile exec playwright install --with-deps chromium

      - name: Run mobile E2E tests
        run: pnpm --filter @splat-connect/mobile test:e2e

      # Traces and page snapshots of what failed; without them a CI-only
      # failure is a test name and a timeout.
      - name: Upload mobile E2E failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-test-results
          path: packages/mobile/test-results
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # The 13 device journeys on an Android emulator. A job-level `if`, never a
  # workflow-level `paths:` filter: a skipped job reads as satisfied to branch
  # protection, a path-filtered workflow stays pending and blocks the merge.
  # Cold run ~30-50 min, warm ~15-25 min; 90 leaves room for the first runs.
  # The AVD snapshot and Gradle caches are saved only on pushes to development,
  # because a cache is restorable only from the same branch or a PR's base.
  maestro-android:
    name: Maestro Android
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVD_KEY: avd-34-x86_64-pixel_6-v1

    steps:
      - uses: actions/checkout@v4

      # The free runner has ~14 GB free; the Android SDK, Gradle, node_modules and
      # Supabase's images do not fit beside the preinstalled toolchains this job never
      # uses. The first run died of "No space left on device" in the release build.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" \
            /usr/local/share/chromium /usr/local/share/powershell
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/mobile/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}

      - name: Start the API against local Supabase
        working-directory: packages/api
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            API_PORT=3102 PORT=3102 nohup ./node_modules/.bin/tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3102/api/public/tutorials >/dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      # The emulator reaches the runner at 10.0.2.2. EXPO_PUBLIC_* are baked in
      # at build. One ABI instead of four: the emulator is x86_64.
      # The Expo template's 512m Metaspace ran out in lintVitalAnalyzeRelease
      # and the daemon then hung to the job timeout; the user-home properties
      # file outranks the generated android/gradle.properties.
      - name: Build the release APK
        working-directory: packages/mobile
        timeout-minutes: 45
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3102
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties
          eval "$(supabase status -o env | sed 's/^/export /')"
          export EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321 EXPO_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm device:build

      - name: Provision the device account
        working-directory: packages/mobile
        run: pnpm --silent device:fixture > "$RUNNER_TEMP/device.env"

      # Cache miss only: boots once without -no-snapshot so a clean snapshot is
      # written. emulator-options replaces the action's defaults, so the rest
      # are copied.
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot"

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          working-directory: packages/mobile
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test $(sed 's/^/--env /' "$RUNNER_TEMP/device.env" | tr '\n' ' ') .maestro/flows/ --format=JUNIT --output "$RUNNER_TEMP/maestro.xml"

      - name: Upload Maestro failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-results
          path: |
            ${{ runner.temp }}/maestro.xml
            ${{ runner.temp }}/api.log
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Gradle cache
        if: success() && github.ref == 'refs/heads/development'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/mobile/package.json') }}

      - name: Save AVD snapshot
        if: success() && github.ref == 'refs/heads/development' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  web-e2e:
    name: Web E2E Tests (${{ matrix.shard }}/4)
    needs: [changes, check, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # 383 tests take 18.5 min locally at the single worker GoTrue's port budget allows,
    # and the 2-core runner is about four times slower (three legs hit a 30 min cap),
    # so the suite runs as four legs, each with its own runner and local Supabase.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase-start

      # The API + Next.js production build are started by Playwright's
      # webServer (see packages/web/playwright.config.ts) and pointed at
      # local Supabase.
      - name: Install Playwright browser
        run: pnpm --filter @splat-connect/web exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm --filter @splat-connect/web test:e2e -- --shard=${{ matrix.shard }}/4

      # Traces and page snapshots of what failed; without them a CI-only
      # failure is a test name and a timeout.
      - name: Upload web E2E failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-test-results-${{ matrix.shard }}
          path: packages/web/test-results
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # The three suites above run against an ephemeral local Supabase, so they can
  # never notice that a committed migration was never pushed to the real project
  # — which is exactly how 032/033 shipped in code while production stayed on the
  # old schema (toys.owner_org_id missing, Toy Library and Exchanges 500ing).
  # This job talks to the linked remote and fails a merge that left migrations
  # unpushed.
  #
  # It used to `exit 0` whenever the deploy secrets were absent. On a repo where
  # they were never configured that is indistinguishable from passing, and it is
  # how this job reported green while the cloud project was missing the
  # profiles_freeze_identity trigger — the 2026-08-28 pentest escalated an
  # ordinary account to admin through exactly that gap. A check that cannot run
  # must now say so loudly. Forks are the one legitimate case: this repo is
  # public and a fork PR genuinely cannot read secrets, so it still skips there
  # and nowhere else.
  migration-drift:
    name: Migration Drift
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Check remote migration drift
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "Fork PR — deploy secrets are unavailable by design. Skipping."
              exit 0
            fi
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF are not configured." >&2
            echo "This check cannot verify the remote, so it fails rather than passes silently." >&2
            echo "Set them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          bash scripts/check-migration-drift.sh

      # The ledger check above cannot see a migration that was marked applied
      # without being executed (`supabase migration repair --status applied`),
      # because the ledger row is written in full either way. That is the actual
      # 2026-08-28 root cause: 009 read as applied, statements and all, while
      # none of its three objects existed. This asserts the objects themselves.
      - name: Check security-critical schema guards
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            [ "$IS_FORK" = "true" ] && exit 0
            exit 1
          fi
          bash scripts/check-schema-guards.sh
